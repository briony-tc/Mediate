<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#111827" />
		<script>
			// Runs before first paint so there's no flash of the wrong theme.
			// Mirrors the fallback logic in $lib/theme.ts - kept inline (not
			// imported) because module scripts execute after the DOM is parsed,
			// which would already be too late to avoid the flash.
			//
			// Also updates the theme-color meta tag's content, not just the html
			// class - Chrome uses that meta tag to tint the Android status bar /
			// gesture-nav bar, including inside the TWA, so a static value here
			// would leave the status bar always dark regardless of which theme is
			// actually showing.
			(function () {
				var stored = localStorage.getItem('theme');
				var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', dark ? '#111827' : '#ffffff');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
