<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so there's no flash of the wrong theme.
			// Mirrors the fallback logic in $lib/theme.ts - kept inline (not
			// imported) because module scripts execute after the DOM is parsed,
			// which would already be too late to avoid the flash.
			(function () {
				var stored = localStorage.getItem('theme');
				var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
